[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
# Minimum supported Rust version; the toolchain used for development is pinned in rust-toolchain.toml.
rust-version = "1.85"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Noisy for a small crate with a flat module layout.
module_name_repetitions = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
