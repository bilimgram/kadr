# Desktop release: push a `desktop-v<version>` tag that matches apps/desktop/package.json.
#
#   build    — Windows, macOS and Linux installers + update metadata (signed when secrets exist)
#   publish  — one job uploads everything to the update feed on R2 (so all platforms' metadata
#              goes live together), creates a draft GitHub Release, and attests build provenance.
#
# Configuration (repository settings → Secrets and variables → Actions), see docs/RELEASING.md:
#   variables: KADR_UPDATE_URL, R2_PUBLIC_URL
#   secrets:   R2_ENDPOINT, R2_BUCKET, R2_ACCESS_KEY, R2_SECRET_KEY, signing secrets (optional)
name: Desktop release

on:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  build:
    name: Build / ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches the app version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$TAG" != "desktop-v$version" ]; then
            echo "::error::Tag $TAG does not match apps/desktop/package.json version $version"
            exit 1
          fi
      - name: Package
        run: pnpm --filter @kadr/desktop dist
        env:
          KADR_UPDATE_URL: ${{ vars.KADR_UPDATE_URL }}
          # macOS signing + notarization (Apple Developer ID); unsigned when absent.
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 != '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows signing (Azure Trusted Signing).
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/desktop/release/*/*.exe
            apps/desktop/release/*/*.dmg
            apps/desktop/release/*/*.zip
            apps/desktop/release/*/*.AppImage
            apps/desktop/release/*/*.deb
            apps/desktop/release/*/*.blockmap
            apps/desktop/release/*/*.yml
            !apps/desktop/release/*/builder-*.yml

  publish:
    name: Publish update feed
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Configure required reviewers on this environment to approve releases before they go live.
    environment: release
    permissions:
      contents: write # draft GitHub Release
      id-token: write # provenance (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: version
        run: echo "version=$(node -p "require('./apps/desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true
          path: apps/desktop/release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            apps/desktop/release/${{ steps.version.outputs.version }}/*.exe
            apps/desktop/release/${{ steps.version.outputs.version }}/*.dmg
            apps/desktop/release/${{ steps.version.outputs.version }}/*.zip
            apps/desktop/release/${{ steps.version.outputs.version }}/*.AppImage
            apps/desktop/release/${{ steps.version.outputs.version }}/*.deb
      - name: Publish to the update feed (R2)
        run: pnpm --filter @kadr/desktop publish:update
        env:
          KADR_UPDATE_URL: ${{ vars.KADR_UPDATE_URL }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" --draft --verify-tag \
            --title "Kadr $VERSION" --generate-notes \
            apps/desktop/release/"$VERSION"/*.{exe,dmg,zip,AppImage,deb}
