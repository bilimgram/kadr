# Desktop release: push a `desktop-v<version>` tag that matches apps/desktop/package.json.
#
#   build    — Windows, macOS and Linux installers + update metadata (signed when secrets exist)
#   publish  — one job attests build provenance, writes an SBOM, uploads everything to the update
#              feed on R2 (so all platforms' metadata goes live together), and publishes the
#              GitHub Release with every installer.
#
# Configuration (repository settings → Secrets and variables → Actions), see docs/RELEASING.md:
#   variables: KADR_UPDATE_URL, R2_PUBLIC_URL (default to the official feed below)
#   secrets:   R2_ENDPOINT, R2_BUCKET, R2_ACCESS_KEY, R2_SECRET_KEY, signing secrets (optional)
# Without the R2 secrets the release is published on GitHub only, with a warning.
name: Desktop release

on:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

env:
  # The official update feed, baked into every build. Forks set their own KADR_UPDATE_URL.
  KADR_UPDATE_URL: ${{ vars.KADR_UPDATE_URL || 'https://updates.bilimgram.uz/kadr/desktop' }}
  R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL || 'https://updates.bilimgram.uz' }}

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  build:
    name: Build / ${{ matrix.os }}
    strategy:
      # Let every platform finish, so one failure doesn't hide another.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches the app version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$TAG" != "desktop-v$version" ]; then
            echo "::error::Tag $TAG does not match apps/desktop/package.json version $version"
            exit 1
          fi
      - name: Smoke test the production build
        if: runner.os != 'macOS'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            xvfb-run -a pnpm --filter @kadr/desktop test:e2e
          else
            pnpm --filter @kadr/desktop test:e2e
          fi
      - name: Package
        shell: bash
        run: |
          set -o pipefail
          # Missing secrets arrive as empty strings, which electron-builder reads as "configured"
          # (an empty CSC_LINK resolves to the project folder). Unset them to build unsigned.
          for var in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID \
            AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET; do
            [ -n "${!var}" ] || unset "$var"
          done
          pnpm --filter @kadr/desktop dist 2>&1 | tee "$RUNNER_TEMP/dist.log"
        env:
          # macOS signing + notarization (Apple Developer ID); unsigned when absent.
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 != '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows signing (Azure Trusted Signing).
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      - name: Report packaging errors
        if: failure()
        shell: bash
        # Annotations show on the run page (and in the API) without signing in; logs don't.
        run: |
          node -e '
            const fs = require("node:fs");
            const log = fs.readFileSync(process.env.RUNNER_TEMP + "/dist.log", "utf8")
              .replace(/\x1b\[[0-9;]*m/g, "").trim().split(/\r?\n/);
            const escape = (s) => s.replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A");
            for (const line of log.filter((l) => /⨯|error/i.test(l)).slice(0, 8)) {
              console.log("::error title=Package::" + escape(line.trim()));
            }
            console.log("::error title=Package log (last lines)::" + escape(log.slice(-30).join("\n")));
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/desktop/release/*/*.exe
            apps/desktop/release/*/*.dmg
            apps/desktop/release/*/*.zip
            apps/desktop/release/*/*.AppImage
            apps/desktop/release/*/*.deb
            apps/desktop/release/*/*.blockmap
            apps/desktop/release/*/*.yml
            !apps/desktop/release/*/builder-*.yml

  publish:
    name: Publish update feed
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Configure required reviewers on this environment to approve releases before they go live.
    environment: release
    permissions:
      contents: write # draft GitHub Release
      id-token: write # provenance (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: version
        run: echo "version=$(node -p "require('./apps/desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true
          path: apps/desktop/release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            apps/desktop/release/${{ steps.version.outputs.version }}/*.exe
            apps/desktop/release/${{ steps.version.outputs.version }}/*.dmg
            apps/desktop/release/${{ steps.version.outputs.version }}/*.zip
            apps/desktop/release/${{ steps.version.outputs.version }}/*.AppImage
            apps/desktop/release/${{ steps.version.outputs.version }}/*.deb
      - name: Software bill of materials
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: apps/desktop/release/${{ steps.version.outputs.version }}/Kadr-${{ steps.version.outputs.version }}-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - id: feed
        name: Check update feed credentials
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
        run: |
          if [ -n "$R2_ACCESS_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::R2 secrets aren't configured, so this release is published on GitHub only. Installed apps see it once it is on the update feed (docs/RELEASING.md)."
          fi
      - name: Publish to the update feed (R2)
        if: steps.feed.outputs.configured == 'true'
        run: pnpm --filter @kadr/desktop publish:update
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node apps/desktop/scripts/release-notes.mjs > "$RUNNER_TEMP/release-notes.md"
          # Versions like 1.3.0-beta.1 are prereleases; everything else becomes "Latest".
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          # Update metadata and blockmaps are attached too, so the feed can be rebuilt from here.
          gh release create "$TAG" --verify-tag "${prerelease[@]}" \
            --title "Kadr $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" \
            apps/desktop/release/"$VERSION"/*.{exe,dmg,zip,AppImage,deb,blockmap,yml} \
            apps/desktop/release/"$VERSION"/*.spdx.json
